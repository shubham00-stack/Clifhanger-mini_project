version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: cliffhanger-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_PORT=8000
      - APP_HOST=0.0.0.0
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - MODEL_PRIMARY_NARRATIVE=${MODEL_PRIMARY_NARRATIVE:-nvidia/nemotron-3-nano-omni-30b-a3b-instruct}
      - MODEL_FAST_TEXT=${MODEL_FAST_TEXT:-nvidia/nemotron-3.5-bolt-e4b}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: cliffhanger-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mcp
    container_name: cliffhanger-mcp
    restart: unless-stopped
    depends_on:
      - api
